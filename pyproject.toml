[tool.black]
line-length = 88
target-version = ['py312']
extend-exclude = '''
/(
    \.agents
  | \.claude
  | \.codex_.*
  | \.pytest_run_tmp
  | \.venv
  | build
  | dist
  | Plugins
  | DebugInfo
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
    ".agents/**",
    ".claude/**",
    ".codex_*/**",
    ".pytest_run_tmp/**",
    ".venv/**",
    "build/**",
    "dist/**",
    "Plugins/**",
    "DebugInfo/**",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-p",
    "no:cacheprovider",
]

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "cerebrus.plugins.s3_uploader.*",
    "cerebrus.tools.memreport.*",
    "cerebrus.plugins.analytics.core.csv_report_parser",
]
ignore_errors = true
